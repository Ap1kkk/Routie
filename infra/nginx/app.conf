server {
    listen 80;
    listen [::]:80;

    server_name routie-dev.ru www.routie-dev.ru;

    server_name routie-dev.ru;

    # Нужно для продления сертификата certbot-контейнером (webroot-метод)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name routie-dev.ru;

    ssl_certificate     /etc/letsencrypt/live/routie-dev.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/routie-dev.ru/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    charset utf-8;

    client_max_body_size 20M;

    root /usr/share/nginx/html;

    # Для подтверждения владения доменом при выпуске/продлении сертификата Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        try_files $uri$args $uri$args/ /index.html;
    }

    location /api {
        proxy_pass http://backend:8080/api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /actuator {
        proxy_pass http://backend:8080/actuator;
    }

    location /swagger-ui {
        proxy_pass http://backend:8080/swagger-ui;
    }

    location /v3 {
        proxy_pass http://backend:8080/v3;
    }

    location /be/static {
        proxy_pass http://backend:8080/static;
    }
}