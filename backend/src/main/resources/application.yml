server:
  host: localhost
  protocol: http
  port: 8080

spring:
  application:
    name: two-steps

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${spring.datasource.database.host}:${spring.datasource.database.port}/${spring.datasource.database.name}
    password: ${POSTGRES_PASSWORD:postgres}
    username: ${POSTGRES_USER:postgres}
    database:
      host: ${POSTGRES_HOST:localhost}
      port: 5432
      name: ${POSTGRES_DB:two-steps}

  liquibase:
    enabled: true
    change-log: classpath:db/migration/db.changelog-main.yaml
    default-schema: public

  minio:
    url: ${MINIO_URL:http://localhost:9000}
    bucket: ${MINIO_BUCKET:images}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}

  jackson:
    default-property-inclusion: non_null

  jpa:
    hibernate:
      ddl-auto: none
#    show-sql: true
#    properties:
#      hibernate.format_sql: true

  servlet:
    multipart:
      enabled: true
      file-size-threshold: 2KB
      max-file-size: 20MB
      max-request-size: 20MB

mvc:
  date-format: "yyyy-MM-dd"
  resource-location: "/uploads/"
  resource-path-pattern: "/static/image/**"

springdoc:
  swagger-ui:
    tags-sorter: ""
    operations-sorter: method
    schemes:
      dev: http://localhost:${server.port}
      prod: https://${SERVER_HOST:localhost}

security:
  jwt:
    secret: ${JWT_SECRET:5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437}
    expiration: 900           # 15 минут
    refresh-expiration: 2592000 # 30 дней
  cors:
    allowed-origin: ${server.protocol}://${server.host}:3000, https://demo.maps.vk.com/api/directions

management:
  endpoints:
    web.exposure.include: health,info,prometheus,heapdump,threaddump,loggers,refresh
  endpoint:
    health:
      probes.enabled: true
      show-details: always
  metrics:
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0
  prometheus:
    metrics:
      export:
        enabled: true
  health:
    audit:
      kafka:
        enabled: false

logging:
  level:
    feign: DEBUG
    root: INFO
    ru.gorkycode.ngtu.sportline: DEBUG
  http-logging:
    enabled: true
    exclude: /actuator/prometheus,/actuator/health

---
# ============================================================
# Профиль TEST — тестовые токены для разработки
# Запуск: -Dspring.profiles.active=test
# ============================================================
spring:
  config:
    activate:
      on-profile: test
  liquibase:
    # Активируем Liquibase-контекст test: вставятся тестовые пользователи
    contexts: test

routie:
  test-tokens:
    tokens:
      # Токен для пользователя с ролью USER (userId = 00000000-0000-0000-0000-000000000001)
      - token: test-token-user
        user-id: 00000000-0000-0000-0000-000000000001
      # Токен для пользователя с ролью ADMIN (userId = 00000000-0000-0000-0000-000000000002)
      - token: test-token-admin
        user-id: 00000000-0000-0000-0000-000000000002